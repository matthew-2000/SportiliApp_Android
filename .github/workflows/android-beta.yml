name: Android - Beta Google Play

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Versione commerciale da provare (es. 2.0.4)
        required: true
        type: string
      version_code:
        description: Numero intero maggiore di tutte le build gia caricate su Play
        required: true
        type: string
      notes_file:
        description: File delle novita italiane nel repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.PLAY_INTERNAL_ENABLED == 'true'
    uses: ./.github/workflows/android-checks.yml

  beta:
    needs: checks
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.PLAY_INTERNAL_ENABLED == 'true'
    environment: play-internal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      SPORTILI_CI_RELEASE: 'true'
      SPORTILI_VERSION_NAME: ${{ inputs.version_name }}
      SPORTILI_VERSION_CODE: ${{ inputs.version_code }}
      SPORTILI_KEYSTORE_PATH: ${{ runner.temp }}/sportili-upload.jks
      SPORTILI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SPORTILI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SPORTILI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NOTES_FILE: ${{ inputs.notes_file }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verifica parametri senza contattare Play
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py' -v
          python3 ci/publish_internal.py
      - name: Ripristino configurazione e chiave esistenti
        env:
          CONFIG_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          config = json.loads(os.environ['CONFIG_JSON'])
          if config['project_info']['project_id'] != 'sportiliapp':
              raise SystemExit('Progetto Firebase inatteso')
          packages = [c['client_info']['android_client_info']['package_name'] for c in config['client']]
          if 'com.matthew.sportiliapp' not in packages:
              raise SystemExit('Package Android inatteso')
          Path('app/google-services.json').write_text(json.dumps(config))
          key = Path(os.environ['SPORTILI_KEYSTORE_PATH'])
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          PY
      - name: Test unitari e bundle firmato
        run: bash ./gradlew :app:testReleaseUnitTest :app:bundleRelease --no-daemon --console=plain
      - name: Conservazione della build prima del caricamento
        uses: actions/upload-artifact@v7
        with:
          name: android-beta-${{ inputs.version_code }}-${{ github.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
      - name: Autenticazione Google senza chiave JSON permanente
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Invio al solo canale interno tramite API ufficiale
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 ci/publish_internal.py --publish
      - name: Rimozione credenziali di firma dal runner
        if: always()
        run: rm -f -- "$SPORTILI_KEYSTORE_PATH" app/google-services.json
      - name: Esiti della release e test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-beta-results-${{ inputs.version_code }}-${{ github.sha }}
          path: |
            play-internal-receipt.json
            app/build/reports/tests/
          retention-days: 30
          if-no-files-found: ignore
