name: Android - Verifica

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Configurazione Firebase fittizia per la sola build CI
        run: cp ci/google-services.demo.json app/google-services.json
      - name: Verifica della procedura Play senza rete
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Compilazione e test unitari
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain
      - name: Risultati dei test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-tests
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  firebase-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase-compatibility/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: firebase-compatibility
      - name: Contratti legacy su emulatori locali
        run: npm test
        working-directory: firebase-compatibility
